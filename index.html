<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="오늘 할 일과 일정, 한 달 캘린더를 한 화면에서 보는 플래너">
<meta name="theme-color" content="#C4DBD9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dooing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>dooing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: 한 열. 위에 '오늘' 박스, 아래 월간 캘린더. 날짜를 누르면 할 일/일정 2분할 버튼이 든 팝오버(모바일은 바텀시트). */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EAEEF1; --line:#DCE2E7;
  --fg:#17202A; --muted:#66727E; --accent:#C4DBD9; --accent-soft:#E4EFEE; --on-accent:#17202A;
  --ev:#3D5BD9; --ev-soft:#E2E7FB;
  --p1:#D64535; --p2:#C98010; --p3:#3D6FD6; --p0:#A3ADB7;
  --sun:#D64535; --sat:#3D6FD6; --moon:#A3B6D3; --today-bg:#FFFBE3; --hlp:55%; --hls:20%;
  --shadow:0 1px 2px rgb(16 24 32 / .06), 0 10px 28px rgb(16 24 32 / .07);
  --shadow-pop:0 4px 10px rgb(16 24 32 / .08), 0 22px 48px rgb(16 24 32 / .18);
  --font-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:var(--font-body);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151B; --surface:#191E26; --surface-2:#222833; --line:#2C3340;
  --fg:#E7EAEF; --muted:#939BAA; --accent:#3FC2AB; --accent-soft:#16372F; --on-accent:#0A1A16;
  --ev:#7F97FF; --ev-soft:#212A4A;
  --p1:#F06A5B; --p2:#EFA53A; --p3:#739CFF; --p0:#5E6776;
  --sun:#F06A5B; --sat:#739CFF; --moon:#6F84A6; --today-bg:#2E2B1C; --hlp:30%; --hls:28%;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 10px 28px rgb(0 0 0 / .3);
  --shadow-pop:0 4px 10px rgb(0 0 0 / .4), 0 22px 48px rgb(0 0 0 / .55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#191E26; --surface-2:#222833; --line:#2C3340;
  --fg:#E7EAEF; --muted:#939BAA; --accent:#3FC2AB; --accent-soft:#16372F; --on-accent:#0A1A16;
  --ev:#7F97FF; --ev-soft:#212A4A;
  --p1:#F06A5B; --p2:#EFA53A; --p3:#739CFF; --p0:#5E6776;
  --sun:#F06A5B; --sat:#739CFF; --moon:#6F84A6; --today-bg:#2E2B1C; --hlp:30%; --hls:28%;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 10px 28px rgb(0 0 0 / .3);
  --shadow-pop:0 4px 10px rgb(0 0 0 / .4), 0 22px 48px rgb(0 0 0 / .55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.page{max-width:1120px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- menu rail ---------- */
.rail{display:flex;justify-content:flex-end;gap:4px;margin-bottom:-8px}
.rail-item{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);text-decoration:none}
.rail-item svg{width:20px;height:20px}
.rail-item:hover{background:var(--surface-2);color:var(--fg)}
.rail-item.on{color:var(--accent)}
.rail-item[data-nav="home"].on{background:var(--accent-soft)}
.rail-item[data-nav="my"].on .avatar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.rail-login{display:none;height:36px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--fg);background:var(--surface-2)}
.rail-login:hover{filter:brightness(.96)}
body.readonly .rail-login{display:inline-flex;align-items:center}
body.readonly [data-nav="my"]{display:none}
body.readonly .t-add,body.readonly .pop [data-new],body.readonly .plus,body.readonly .t-del,body.readonly #reset{display:none}
body.readonly .t-label,body.readonly .box,body.readonly .t-title,body.readonly .pop [data-act],body.readonly .cchip{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;flex:none;line-height:1}
.avatar.sm{width:26px;height:26px;font-size:12px}
.avatar.lg{width:68px;height:68px;font-size:26px}
.avatar.photo{background-color:var(--surface-2);background-size:cover;background-position:center}
.avatar-btn{border:0;padding:0;cursor:pointer}
.avatar-btn:hover{filter:brightness(.93)}
.photo-acts{display:flex;gap:12px;margin-top:6px}
.color-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cc-wheel{width:40px;height:38px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);cursor:pointer}
#cc-hex{height:38px;width:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);text-transform:uppercase}
#cc-hex:focus{outline:none;border-color:var(--accent)}
.ce-row.custom{padding-top:8px;border-top:1px dashed var(--line)}
.card-hrow{display:flex;align-items:center;gap:12px}
.card-hrow .card-h{margin-right:auto}
.btn.sm{height:28px;padding:0 12px;font-size:12px}
#main-colors.editing .ce-c{position:relative;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ce-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface);cursor:pointer}
.ce-c.dragging{opacity:.3;transform:scale(.85)}
.pal-ghost{position:fixed;z-index:70;width:34px;height:34px;border-radius:50%;background:var(--sw);pointer-events:none;transform:translate(-50%,-50%) scale(1.15);box-shadow:var(--shadow-pop),inset 0 0 0 1px rgb(0 0 0 / .1)}
body.pal-dragging,body.pal-dragging *{cursor:grabbing!important}
.switch-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding-top:4px;position:relative}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.sw-track{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch-row input:checked + .sw-track{background:var(--accent)}
.switch-row input:checked + .sw-track::after{transform:translateX(16px)}
.switch-row input:focus-visible + .sw-track{outline:2px solid var(--accent);outline-offset:2px}
.switch-row b{display:block;font-size:13.5px}
.switch-row small{display:block;font-size:12px;color:var(--muted)}

/* ---------- my page ---------- */
.my{max-width:640px;width:100%}
.my-title{margin:0;font-size:24px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.my-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;padding:0 4px}
.plain{display:flex;flex-direction:column;gap:10px;min-width:0}
.plain .mseg{display:flex;flex-wrap:wrap;align-self:stretch}
.plain .mseg button{flex:1 1 auto;padding:6px 8px;white-space:nowrap}
.card-h{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.prof{display:flex;align-items:center;gap:16px;min-width:0}
.prof-text{display:flex;flex-direction:column;min-width:0}
.prof-text b{font-size:18px;overflow-wrap:anywhere}
.av-wrap{position:relative;flex:none}
.cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 1px 3px rgb(0 0 0 / .15);padding:0;cursor:pointer}
.cam:hover{background:var(--surface-2)}
.name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.acct{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
.acct svg{flex:none}
.acct[hidden]{display:none}
.my-foot{display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.prof-text span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.swatches{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.swatch{display:grid;place-items:center;padding:7px;border-radius:50%}
.swatch:hover{background:var(--surface-2)}
.swatch .sw{width:30px;height:30px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.swatch.on .sw{box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08),0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.sw-div{width:1px;height:24px;background:var(--line);margin:0 6px}
.mseg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.mseg button{padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.mseg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.note{font-size:12px;color:var(--muted);margin:0}
.acc-lead{font-size:13.5px;margin:0}
.acc-btns{display:flex;flex-direction:column;gap:8px;max-width:340px}
.btn.wide{height:42px;font-size:14px;width:100%}
.btn.google{position:relative;overflow:hidden;gap:10px;background:#fff;border-color:#dadce0;color:#1f1f1f}
.btn.google:hover{background:#f8f9fa;border-color:#c6c9cc}
.btn.kakao{gap:10px;background:#fff;border-color:#dadce0;color:#1f1f1f}
.btn.kakao:hover{background:#f8f9fa;border-color:#c6c9cc}
.acc-or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.acc-or::before,.acc-or::after{content:"";flex:1;height:1px;background:var(--line)}
.acc-form{display:flex;flex-direction:column;gap:12px}
.pw{position:relative;display:flex}
.pw input{width:100%;padding-right:42px!important}
.eye{position:absolute;right:2px;top:0;bottom:0;width:40px;display:grid;place-items:center;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.eye.on{color:var(--fg)}
.acc-form input:not([type=checkbox]){height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;font-size:14px;color:var(--fg)}
.acc-form input:focus{outline:none;border-color:var(--accent)}
.agree{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.agree a{color:inherit;text-decoration:underline}
.agree.bad{color:var(--p1)}
.gate-sub{margin:0 0 4px;font-size:18px;font-weight:700}
.gate .acc-btns .gate-links{margin:2px 0 6px}
.gate .acc-status{text-align:center}
.acc-email{display:flex;gap:8px}
.acc-email input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;font-size:14px;color:var(--fg)}
.acc-email input:focus{outline:none;border-color:var(--accent)}
.acc-email .btn{height:42px}
.acc-me{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-me b{font-size:14px;overflow-wrap:anywhere}
.acc-status{font-size:12px;color:var(--muted)}
.acc-acts{display:flex;gap:8px;flex-wrap:wrap}
/* 처음 화면: 로그인(회원가입) */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;overflow:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{width:min(380px,100%);display:flex;flex-direction:column;gap:22px}
.gate-logo{margin:0;font-family:var(--font-num);font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--accent)}
.gate-tag{margin:0 0 12px;color:var(--muted);font-size:14px}
.gate .acc-btns{max-width:none;gap:14px}
.gate .acc-btns>.btn{margin:0}
.gate .acc-btns>.btn.google{margin-bottom:-2px} /* 간편 로그인 버튼 사이를 입력칸 간격(12px)에 맞춤 */
.my-foot .acc-acts{justify-content:flex-end}
.my-foot .btn:not(.primary){background:transparent}
.gate-note{margin:4px 0 0;font-size:12px;color:var(--muted)}
.gate-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.gate-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.gate-row .gl{display:flex;gap:16px}
.gate-back{display:inline-block;margin-left:8px;vertical-align:baseline;color:color-mix(in srgb,var(--muted) 45%,var(--bg));background:none;border:0;padding:0;line-height:0;cursor:pointer}
.gate-back svg{display:block}
.gate-back:hover{color:var(--muted)}
.gate-back[hidden]{display:none}
.gate-foot[hidden]{display:none}
.gate-foot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center}
.gate-links.stack{flex-direction:column;align-items:center;gap:12px}
body.gated{overflow:hidden}

/* ---------- split button ---------- */
.split{display:inline-flex;align-items:stretch;border-radius:11px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.split button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;font-weight:600;font-size:13.5px;flex:1;white-space:nowrap}
.split button svg{width:17px;height:17px;flex:none}
.split button[data-new]{color:var(--fg)}
.split button[data-new="task"]:hover{background:var(--accent-soft)}
.split button[data-new="event"]:hover{background:var(--ev-soft)}
.split .div{width:1px;background:var(--line)}
.split.wide{display:flex;width:100%}
.split.wide button{padding:13px 10px;flex-direction:column;gap:4px;font-size:13.5px}
.split.wide button svg{width:22px;height:22px}

/* ---------- today box (위젯형, 미니멀) ---------- */
#today{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:32px}
.t-date{display:flex;flex-direction:column}
.t-ym{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.t-ym b{font-size:16px;font-weight:800;color:var(--fg);font-variant-numeric:proportional-nums;letter-spacing:-.03em}
.t-day{font-family:var(--font-num);font-size:68px;font-weight:800;line-height:1;letter-spacing:-.04em;margin-top:4px;color:var(--accent)}
.t-dow{font-size:15px;font-weight:600;margin-top:6px}
.t-bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:6px}
.t-bar span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.t-add{margin-top:auto;padding-top:20px}
.msplit{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.msplit button{padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.msplit button:hover{color:var(--fg);background:var(--surface-2)}
.msplit .div{width:1px;background:var(--line)}
.t-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 32px;align-content:start;min-width:0}
.t-block{min-width:0}
.t-label{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 28%,transparent);color:color-mix(in srgb,var(--c) 50%,var(--fg))}
.t-label .plus{font-weight:500;opacity:.55;font-size:13px;line-height:1}
.t-label:hover .plus{opacity:1}
.t-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.t-item{position:relative;min-width:0;border-radius:10px}
.t-row{display:flex;align-items:center;gap:10px;padding:5px 0;min-width:0;position:relative;z-index:1;background:var(--surface);touch-action:pan-y;transition:transform .2s ease}
.t-del{position:absolute;top:2px;bottom:2px;right:0;width:64px;border-radius:8px;background:var(--p1);color:#fff;display:grid;place-items:center;visibility:hidden}
.t-item.swiping .t-del,.t-item.swiped .t-del{visibility:visible}
.t-item.swiped .t-row{transform:translateX(-72px)}
body.swiping-row{user-select:none;-webkit-user-select:none}
.box{width:18px;height:18px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--line));flex:none;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.box svg{width:11px;height:11px}
.box:hover{border-color:var(--c)}
.t-item.done .box{background:var(--c);border-color:color-mix(in srgb,var(--c) 80%,var(--fg));color:var(--oc,#fff)}
.t-title{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.t-item.done .t-title{color:var(--muted);text-decoration:line-through}
.t-item.done .t-meta,.t-item.done .t-meta.up{color:var(--muted)}
.t-meta{font-family:var(--font-num);font-size:11.5px;color:var(--muted);flex:none}
/* 할 일: 시간·'어제' 표시를 제목 바로 옆에 */
.t-item.tk .t-title{flex:0 1 auto}
.t-item.tk .t-meta{margin-left:-4px}
.t-item.tk.late .t-row{opacity:.5}
.t-meta.late{color:var(--p1);font-family:var(--font-body);font-weight:600}
.t-item.tk{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:10px;transition:box-shadow .15s,background .15s}
.t-item.lifted{position:relative;z-index:2;background:var(--surface);box-shadow:var(--shadow-pop);padding-inline:8px;margin-inline:-8px}
body.row-dragging,body.row-dragging *{cursor:grabbing!important}
.t-ev .tm{width:40px;flex:none;font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.t-ev .bar{width:3px;height:15px;border-radius:2px;background:var(--c);flex:none}
.t-ev.now .tm{color:var(--ev);font-weight:700}
.t-up-block{grid-column:1/-1}
.t-up-block .t-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,auto);grid-auto-flow:column;column-gap:32px}
@media (max-width:560px){.t-up-block .t-list{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}}
.t-up-block .t-item:nth-child(2){opacity:.93}.t-up-block .t-item:nth-child(3){opacity:.86}.t-up-block .t-item:nth-child(4){opacity:.79}.t-up-block .t-item:nth-child(5){opacity:.72}
.t-up-block .t-item:nth-child(6){opacity:.65}.t-up-block .t-item:nth-child(7){opacity:.58}.t-up-block .t-item:nth-child(8){opacity:.5}.t-up-block .t-item:nth-child(9){opacity:.42}.t-up-block .t-item:nth-child(10){opacity:.34}
/* 체크한 오늘·예정 할 일은 사라지지 않고 취소선 + 확 흐리게 (지난 할 일만 체크하면 사라짐) */
.t-item.tk.done,.t-up-block .t-item.tk.done{opacity:.3}
.t-label.up{background:none;color:hsl(var(--comp-h,350) var(--comp-s,40%) var(--comp-l,66%));padding-left:0;font-weight:600}
.t-item .t-meta.up{margin:0 -3px 0 0;font-family:var(--font-body);font-weight:600;font-size:12px;color:hsl(var(--comp-h,350) var(--comp-s,40%) var(--comp-l,66%))}
.t-item.up .t-title{flex:0 1 auto}
.t-item.up .t-title{color:var(--muted)}
.t-empty{font-size:12.5px;color:var(--muted);padding:5px 0;margin:0}

/* ---------- rows ---------- */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:11px;padding:8px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--pc,var(--p0));flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.check svg{width:12px;height:12px}
.check:hover{color:var(--pc,var(--p0))}
.check.p1{--pc:var(--p1)} .check.p2{--pc:var(--p2)} .check.p3{--pc:var(--p3)}
.row.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.evtime{flex:none;width:58px;font-family:var(--font-num);font-size:12.5px;font-weight:600;color:var(--ev);padding-top:1px;border-right:2px solid var(--c,var(--ev));margin-right:1px}
.row-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.meta .late{color:var(--p1);font-weight:600}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);margin-right:4px;vertical-align:1px}
.empty{color:var(--muted);font-size:13px;padding:8px 2px;margin:0}

/* ---------- calendar ---------- */
.cal-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px}
.cal-mid{display:flex;align-items:center;gap:12px}
.cal-h h2{margin:0;display:flex;align-items:baseline;justify-content:center;gap:.4em;font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:4.2em;line-height:1.1}
.ym-y{font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:.02em}
/* 달 숫자: 오늘 박스 날짜처럼 숫자를 붙이고 자간을 좁게 (고정폭 숫자 끔) */
.ym-m{font-family:var(--font-num);font-variant-numeric:proportional-nums;font-size:1.3em;font-weight:800;letter-spacing:-.05em;line-height:1}
.cal-right{justify-self:end}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.arrow:hover{background:var(--surface-2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.icon{width:32px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--p1)}
.btn.danger.armed{background:var(--p1);border-color:var(--p1);color:#fff}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow div{padding:8px 10px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-dow div:first-child{color:var(--sun)} .cal-dow div:last-child{color:var(--sat)}
.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cal-grid .cell:nth-last-child(-n+7){border-bottom:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.cell.out .dnum{opacity:.45}
.cell.sel{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.dtop{display:flex;flex-direction:column;align-items:center;min-width:0;margin-bottom:2px}
.dnum{font-family:var(--font-num);font-weight:600;font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.sun .dnum,.cell.hd .dnum{color:var(--sun)} .cell.sat .dnum{color:var(--sat)} .cell.sat.hd .dnum{color:var(--sun)}
/* 오늘: 배경색 없이 칸 테두리를 메인 컬러로 살짝 두껍게 (선택 표시보다 위) */
.cell.today{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cell.today .dnum{color:var(--accent);font-weight:800}
.cell.today .dnum.pulse{animation:todayPulse 1.2s ease-out}
@keyframes todayPulse{
  0%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
  45%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 12px transparent}
  100%{background:transparent;box-shadow:0 0 0 0 transparent}
}
.pop.tinted .pill{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 45%,var(--fg))}
.pop.tinted .allday.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pop.tinted .field input:focus,.pop.tinted .field select:focus{border-color:color-mix(in srgb,var(--accent) 70%,var(--fg))}
.hol{font-size:10px;line-height:1.2;max-width:100%;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lunar{display:flex;align-items:center;gap:2px;margin-top:1px;font-size:9.5px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lunar .lt{opacity:.7}
.t-day.hd{color:var(--sun)}
.cchips{display:flex;flex-direction:column;gap:2px;min-width:0}
.cchip{display:block;font-size:11.5px;line-height:1.4;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.ev{color:var(--fg)}
.cchip .ct{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cchip.ev b{font-family:var(--font-num);font-weight:600;color:var(--ev);margin-right:3px}
.cchip.tk::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--accent);border-radius:50%;margin-right:5px;vertical-align:-1px}
.cchip.tk.done{color:var(--muted);text-decoration:line-through}
.cchip.tk.done::before{background:var(--accent);border-color:var(--accent)}
.t-ev .tm b{font:inherit;color:inherit}
.tseg{position:relative;display:inline-grid;grid-template-columns:repeat(3,1fr);height:34px;padding:3px;gap:0;border-radius:999px;background:var(--surface-2);isolation:isolate}
.tseg::before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc(33.333% - 2px);border-radius:999px;background:var(--accent);box-shadow:0 1px 3px rgb(16 24 32 / .18);transition:transform .2s ease}
.tseg:has(button:nth-child(2).on)::before{transform:translateX(100%)}
.tseg:has(button:nth-child(3).on)::before{transform:translateX(200%)}
.tseg button{padding:0 14px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;border-radius:999px;transition:color .2s}
.tseg button.on{color:var(--on-accent);font-weight:700}
.cmore{font-size:11px;color:var(--muted);padding-left:5px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots i.ev{background:var(--ev)}

.foot{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.linkbtn.warn{color:var(--p1)}

/* ---------- popover ---------- */
.pop-back{position:fixed;inset:0;z-index:40;background:transparent}
.pop{position:absolute;z-index:41;width:350px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);padding:16px;display:flex;flex-direction:column;gap:12px;animation:popin .14s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.pop-h{display:flex;align-items:center;gap:8px}
.pop-h h2{margin:0;font-size:16px;font-weight:700}
.pop-h .sub{color:var(--muted);font-size:12.5px}
.pop-h .x{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.pop-h .x:hover,.pop-h .back:hover{background:var(--surface-2)}
.pop-h .back{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.pop-list{max-height:260px;overflow:auto;margin:0 -2px;padding:0 2px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.task{background:var(--accent-soft);color:var(--accent)}
.pill.event{background:var(--ev-soft);color:var(--ev)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;font-weight:400;color:var(--fg);width:100%;min-width:0}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.dp-btn{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;font-weight:400;color:var(--fg);width:100%;text-align:left;font-family:var(--font-num);cursor:pointer}
.dp-btn:focus-visible,.dp-btn[aria-expanded="true"]{outline:none;border-color:var(--accent)}
.dp{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px}
.dp[hidden]{display:none}
.dp-h{display:grid;grid-template-columns:34px 1fr 34px;align-items:center}
.dp-h .nav{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.dp-h .nav:hover{background:var(--surface-2);color:var(--fg)}
.dp-h .ym{justify-self:center;display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;font-family:var(--font-num);color:var(--fg)}
.dp-h .ym span{font-size:15px;font-weight:600;letter-spacing:-.03em;color:var(--muted)}
.dp-h .ym b{font-size:19px;font-weight:800;letter-spacing:-.04em}
.dp-yr{justify-self:center;text-align:center;font-family:var(--font-num);font-size:20px;font-weight:800;letter-spacing:-.04em}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dp-w{font-size:11px;font-weight:600;color:var(--muted);padding-bottom:2px}
.dp-w .sun{color:var(--sun)} .dp-w .sat{color:var(--sat)}
.dp-g{gap:2px 0}
.dp-d{width:28px;height:28px;margin:3px auto;display:grid;place-items:center;font-size:13px;font-weight:500;border-radius:50%;font-family:var(--font-num);color:var(--fg)}
.dp-d.sat{color:var(--sat)} .dp-d.sun{color:var(--sun)}
.dp-d.out{opacity:.38}
.dp-d.today{font-weight:800}
.dp-d:hover{background:var(--surface-2)}
.dp-d.on,.dp-d.on:hover{background:var(--accent);color:var(--on-accent);opacity:1;font-weight:500}
.dp-m{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dp-m button{height:40px;font-size:14px;font-weight:600;border-radius:999px;color:var(--fg)}
.dp-m button:hover{background:var(--surface-2)}
.dp-m button.on{background:var(--accent);color:var(--on-accent);font-weight:500}
.field.title input{height:42px;font-size:15px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hintline{font-size:11.5px;color:var(--muted);margin-top:-6px}
.form[data-type="task"] [data-only="event"],.form[data-type="event"] [data-only="task"]{display:none}
.form[data-type="event"][data-allday="1"] [data-timefield]{display:none}
.allday{margin-left:auto;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.allday:hover{color:var(--fg)}
.allday.on{background:var(--ev);border-color:var(--ev);color:var(--surface)}
.evtime.ad,.t-ev.ad .tm{font-size:11px;letter-spacing:0;font-weight:600}
.cchip.ad .ct{font-weight:500}
.ev-ic{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--fg);line-height:1}
.ev-ic svg{display:block;width:14px;height:14px}
.cchip.ev{display:flex;align-items:center}
.cchip.ev > b{flex:none}
.cchip .ev-ic{margin-right:1px}
.cchip .ev-ic + .ct{padding-left:.12em}
.t-ev .tm{display:flex;align-items:center}
.evtime .ev-ic{display:flex}
.t-ev .tm .ev-ic svg,.evtime .ev-ic svg{width:18px;height:18px}
/* all day 일정: 형광펜으로 그은 듯한 하이라이트 (카테고리 색의 파스텔톤, 다크 모드는 어둡게 섞임) */
.cchip.ev.ad{padding-inline:2px}
.cchip.ev.ad .ct{padding:0 .3em;border-radius:.9em .25em .8em .3em;
  background-image:linear-gradient(-100deg,color-mix(in srgb,var(--hl) 35%,transparent),var(--hl) 12%,var(--hl) 88%,color-mix(in srgb,var(--hl) 30%,transparent));
  background-repeat:no-repeat;background-size:100% 74%;background-position:0 80%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cat-group{display:flex;flex-direction:column;gap:8px}
.cat-label{font-size:12px;font-weight:600;color:var(--muted)}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.cat-chip:hover{background:var(--surface-2)}
.cat-chip[data-cat]{touch-action:none;user-select:none;-webkit-user-select:none}
.cat-chip.dragging{opacity:.45;border-style:dashed;cursor:grabbing}
body.cat-dragging,body.cat-dragging *{cursor:grabbing!important}
.cat-chip .cdot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.cat-chip.on{border-color:var(--fg)}
.cat-chip.add{width:32px;height:32px;padding:0;justify-content:center;color:var(--muted);border-style:dashed;font-size:16px;font-weight:500}
.cat-editor{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.ce-colors{display:flex;flex-direction:column;gap:8px}
.ce-row{display:flex;flex-wrap:wrap;gap:6px}
.ce-c{width:30px;height:30px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.ce-c.on{box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1),0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.row-tools{display:flex;gap:2px;flex:none;align-self:center}
.rt{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.rt:hover{background:var(--surface-2);color:var(--fg)}
.rt svg{width:17px;height:17px}
.rep button{padding:5px 12px}
.cal-left{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cchip.tk[data-tid]{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.cchip.tk[data-tid]:hover{background:var(--surface-2)}
.cchip.tk[data-tid]::before{border-color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.cchip.tk.done[data-tid]::before{background:var(--accent);border-color:var(--accent)}
.cchip.clip{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.cchip.chip-lift{opacity:.3}
.cell.drop{background:var(--accent-soft)}
body.pasting .cell{cursor:copy}
body.dragging,body.dragging *{cursor:grabbing!important}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;padding:5px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--accent);box-shadow:var(--shadow-pop);font-size:12.5px;font-weight:500;transform:translate(-50%,-130%);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.cal-hint{margin:8px 2px 0;font-size:12px;color:var(--muted)}
.clipbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:7px 7px 7px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-pop);max-width:calc(100% - 32px)}
.clipbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clipbar button{padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg);font-weight:600;font-size:12.5px;flex:none}
body.pasting .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.err{color:var(--p1);font-size:12px}
.pop-actions{display:flex;gap:8px;align-items:center}
.grow{flex:1}

.cfm-back{position:fixed;inset:0;z-index:90;background:rgb(0 0 0 / .32);display:grid;place-items:center;padding:16px}
.cfm-back[hidden]{display:none}
.cfm{width:min(350px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);padding:20px 18px 16px;display:flex;flex-direction:column;gap:18px}
.cfm p{margin:0;font-size:14.5px;line-height:1.6;white-space:pre-line;word-break:keep-all;text-align:center;font-weight:600}
.cfm-acts{display:flex;gap:8px;justify-content:flex-end}
.cfm-acts .btn{height:36px;padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13px;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  #today{grid-template-columns:minmax(0,1fr);gap:20px;padding:22px}
  .t-blocks > .t-block{order:2}
  .t-blocks > .t-ev-block{order:0}
  .t-date{display:grid;grid-template-columns:1fr auto;column-gap:12px}
  .t-ym,.t-day,.t-dow{grid-column:1}
  .t-day{font-size:56px}
  .t-add{grid-column:2;grid-row:1/4;padding-top:0;align-self:end}
}
@media (max-width:640px){
  /* iOS는 글자가 16px 미만인 입력칸을 누르면 화면을 확대해 버려서 모바일에서만 키움 */
  .acc-form input:not([type=checkbox]),.acc-email input,.field input,.field select,.field textarea{font-size:16px}
  .page{padding-block:16px 40px}

// 예전 데이터: 카테고리 하나를 일정·할 일이 같이 썼음 → 일정용 사본(e-…)을 만들어 나눔
function migrate(v) {
  v.projects = v.projects || [];
  const old = v.projects.filter(p => !p.kind);
  if (old.length) {
    const ids = new Set(old.map(p => p.id));
    v.projects = [...v.projects.filter(p => p.kind), ...old.map(p => ({ ...p, kind: 'task' })), ...old.map(p => ({ ...p, id: 'e-' + p.id, kind: 'event' }))];
    v.items.forEach(i => { if (i.type === 'event' && ids.has(i.project)) i.project = 'e-' + i.project; });
  }
  // 순서가 없는 할 일에 순서 매기기 (예전 데이터·예시 데이터)
  let top = Math.max(0, ...v.items.filter(i => i.type === 'task').map(i => i.order || 0));
  v.items.forEach(i => { if (i.type === 'task' && typeof i.order !== 'number') i.order = ++top; });
  return v;
}
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { const v = JSON.parse(raw); if (v && Array.isArray(v.items)) return migrate(v); } } catch (e) {}
  return migrate(seed());
}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ items: state.items, projects: state.projects })); } catch (e) {} queueCloudSave(); }
const proj = id => state.projects.find(p => p.id === id);
const cats = kind => state.projects.filter(p => p.kind === kind);
const newId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const prioRank = p => (p ? p : 4);
// 할 일은 사용자가 끌어서 정한 순서(order) 그대로
const byTask = (a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || (a.time || '99').localeCompare(b.time || '99');
const nextOrder = () => Math.max(0, ...state.items.filter(x => x.type === 'task').map(x => x.order || 0)) + 1;
// 일정: 시간 없는 all day 일정이 맨 위(가나다순), 그다음 시간순
// all day 안에서는 생일 → 시험 → 나머지, 같은 묶음끼리는 가나다순
const adRank = x => { const n = (proj(x.project) || {}).name || ''; return n.includes('생일') ? 0 : n.includes('시험') ? 1 : 2; };
const byEvent = (a, b) => (!!a.time - !!b.time) || (a.time ? a.time.localeCompare(b.time) : (adRank(a) - adRank(b)) || a.title.localeCompare(b.title, 'ko'));
// 반복 일정: 시작일 이후 같은 요일(매주) · 같은 날짜(매달) · 같은 월일(매년)에 나타남
const occursOn = (x, k) => {
  if (x.date === k) return true;
  if (!x.repeat || !x.date || x.date > k) return false;
  const a = fromKey(x.date), b = fromKey(k);
  if (x.repeat === 'weekly') return Math.round((b - a) / 864e5) % 7 === 0;
  if (x.repeat === 'monthly') return a.getDate() === b.getDate();
  if (x.repeat === 'yearly') return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  return false;
};
const dayItems = k => {
  const evs = state.items.filter(x => x.type === 'event' && occursOn(x, k)).map(x => (x.date === k ? x : { ...x, date: k }));
  const tasks = state.items.filter(x => x.type === 'task' && x.date === k);
  return [...evs.sort(byEvent), ...tasks.sort(byTask)];
};

/* ---------- natural-language hints inside the title (선택) ---------- */
function parseQuick(input) {
  let s = ' ' + input + ' ';
  const out = { title: '', date: null, time: null, dur: null, projectName: null, prio: 0, deadline: false };
  const hits = [];
  const take = (re, fn) => { const m = s.match(re); if (!m) return false; fn(m); hits.push(m[0]); s = s.replace(m[0], ' '); return true; };
  const t = TODAY(), wd = c => '일월화수목금토'.indexOf(c), P = '(?:에|까지|부터)?';
  take(/\s!([1-3])(?=\s)/, m => out.prio = +m[1]);
  take(/\s#([^\s#!]+)/, m => out.projectName = m[1]);
  take(/\s(\d+(?:\.\d+)?)\s*시간(?:\s*동안)?(?=\s)/, m => out.dur = Math.round(parseFloat(m[1]) * 60));
  const rules = [
    [new RegExp('\\s다음\\s*주\\s*([월화수목금토일])(?:요일)?' + P + '(?=\\s)'), m => { const mon = addDays(t, -((t.getDay() + 6) % 7) + 7); out.date = key(addDays(mon, (wd(m[1]) + 6) % 7)); }],
    [new RegExp('\\s(오늘|내일|모레|글피)' + P + '(?=\\s)'), m => out.date = key(addDays(t, { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]))],
    [new RegExp('\\s(\\d{1,2})월\\s*(\\d{1,2})일' + P + '(?=\\s)'), m => { let d = new Date(t.getFullYear(), +m[1] - 1, +m[2]); if (d < t) d = new Date(t.getFullYear() + 1, +m[1] - 1, +m[2]); out.date = key(d); }],
    [new RegExp('\\s(?:이번\\s*주\\s*)?([월화수목금토일])요일' + P + '(?=\\s)'), m => out.date = key(addDays(t, (wd(m[1]) - t.getDay() + 7) % 7))],
  ];
  for (const [re, fn] of rules) if (take(re, fn)) break;
  take(new RegExp('\\s(오전|오후|아침|저녁|밤|낮)?\\s*(\\d{1,2})시(?:\\s*(반|(\\d{1,2})분))?' + P + '(?=\\s)'), m => {
    let h = +m[2]; const mer = m[1]; const mi = m[3] === '반' ? 30 : (m[4] ? +m[4] : 0);
    if (['오후', '저녁', '밤'].includes(mer) && h < 12) h += 12;
    if (mer === '낮' && h < 6) h += 12;
    if (!mer && h >= 1 && h <= 7) h += 12;
    if (mer === '오전' && h === 12) h = 0;
    if (h < 24 && mi < 60) out.time = `${pad(h)}:${pad(mi)}`;
  }) || take(new RegExp('\\s(\\d{1,2}):(\\d{2})' + P + '(?=\\s)'), m => { if (+m[1] < 24 && +m[2] < 60) out.time = `${pad(+m[1])}:${m[2]}`; });
  out.deadline = hits.some(h => h.includes('까지'));
  out.title = s.replace(/\s+/g, ' ').trim().replace(/^(에|까지|부터)\s+/, '');
  return out;
}

const IC_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg>';

function rowHTML(it, opt = {}) {
  const p = proj(it.project), tk = key(TODAY());
  const meta = [];
  if (opt.showDate && it.date) meta.push(`<span class="${it.type === 'task' && !it.done && it.date < tk ? 'late' : ''}">${dateLabel(it.date)}</span>`);
  if (it.type === 'event' && it.time) meta.push(`<span class="num">${fmtTime(it.time)} – ${fmtTime(endTime(it.time, it.dur))}</span>`);
  if (it.repeat) meta.push(`<span>${REP_LABEL[it.repeat] || ''}</span>`);
  if (it.type === 'task' && it.time) meta.push(`<span class="num">${fmtTime(it.time)}까지</span>`);
  if (p) meta.push(`<span><span class="pdot" style="--c:${p.color}"></span>${esc(p.name)}</span>`);
  let past = false;
  if (it.type === 'event' && it.time && it.date === tk) { const n = new Date(); past = toMin(endTime(it.time, it.dur)) < n.getHours() * 60 + n.getMinutes(); }
  if (it.type === 'event' && it.date < tk) past = true;
  const tools = opt.tools && it.type === 'task'
    ? `<span class="row-tools"><button class="rt" data-clip="copy" aria-label="복사해서 다른 날짜에 붙여넣기" title="복사">${IC_COPY}</button><button class="rt" data-clip="move" aria-label="다른 날짜로 옮기기" title="옮기기">${IC_MOVE}</button></span>` : '';
  const lead = it.type === 'event'
    ? `<span class="evtime ${it.time ? '' : 'ad'}" style="--c:${p ? p.color : 'var(--ev)'}">${it.time || evIcon(it) || 'all day'}</span>`
    : `<button class="check" data-act="toggle" aria-label="${it.done ? '완료 취소' : '완료로 표시'}">${IC.check}</button>`;
  return `<li class="row ${it.done ? 'done' : ''} ${past ? 'past' : ''}" data-id="${it.id}">${lead}<button class="row-main" data-act="edit"><span class="row-title">${esc(it.title)}</span>${meta.length ? `<span class="meta">${meta.join('')}</span>` : ''}</button>${tools}</li>`;
}

/* ---------- today box ---------- */
function renderToday() {
  const t = TODAY(), tk = key(t);
  const lateOpt = prefs.late || 'all', span = lateOpt === 'off' ? 0 : /^\d+$/.test(lateOpt) ? Number(lateOpt) : 14; // 설정(어제/그저께/2주/표시 안 함)이 지난 할 일과 예정된 일정의 범위를 함께 정함
  const lateFrom = key(addDays(t, -span));
  const overdue = lateOpt === 'off' ? [] : state.items.filter(i => i.type === 'task' && !i.done && i.date && i.date < tk && i.date >= lateFrom);
  const tasks = state.items.filter(i => i.date === tk && i.type === 'task');

  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();

  const evRows = events.map(e => {
    const p = proj(e.project), st = e.time ? toMin(e.time) : 0, en = e.time ? toMin(endTime(e.time, e.dur)) : 0;
    const cls = !e.time ? 'ad' : en < nowM ? 'past' : (st <= nowM ? 'now' : '');
    return `<li class="t-item t-ev ${cls}" data-id="${e.id}"><div class="t-row"><span class="tm">${e.time || evIcon(e) || 'all day'}</span><span class="bar" style="--c:${p ? p.color : 'var(--ev)'}"></span><button class="t-title" data-act="edit">${esc(e.title)}</button></div><button class="t-del" data-act="del" aria-label="삭제" title="삭제"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8V7M6.5 7l.8 12.1c.1.8.7 1.4 1.5 1.4h6.4c.8 0 1.4-.6 1.5-1.4L17.5 7M10 11v6M14 11v6"/></svg></button></li>`;
  }).join('');
  const evBlock = !evRows ? '' : `<div class="t-block t-ev-block"><button class="t-label" style="--c:var(--accent)" data-new="event" data-d="${tk}" aria-label="오늘 일정 추가">일정</button>
    <ul class="t-list">${evRows}</ul></div>`;

  const gid = i => (proj(i.project) ? i.project : '');
  const all = [...overdue, ...tasks];
  const groups = cats('task').map(p => ({ id: p.id, name: p.name, color: p.color }));
  if (all.some(i => gid(i) === '')) groups.push({ id: '', name: '기타', color: 'var(--accent)' });
  const taskBlocks = groups.map(g => {
    const its = all.filter(i => gid(i) === g.id).sort((a, b) => ((a.date < tk) - (b.date < tk)) || byTask(a, b)); // 날짜 지난 할 일은 맨 아래
    if (!its.length) return ''; // 오늘 할 일이 없는 카테고리는 칩도 숨김
    const rows = its.map(i => {
      const late = !i.done && i.date < tk;
      const meta = late ? `<span class="t-meta late">${boxDate(i.date)}</span>` : (i.time ? `<span class="t-meta">${i.time}</span>` : '');
      return `<li class="t-item tk ${i.done ? 'done' : ''} ${late ? 'late' : ''}" data-id="${i.id}" style="--c:${g.color};--oc:${onColor(g.color)}"><div class="t-row"><button class="box" data-act="toggle" aria-label="${i.done ? '완료 취소' : '완료로 표시'}">${IC.check}</button><button class="t-title" data-act="edit">${esc(i.title)}</button>${meta}</div><button class="t-del" data-act="del" aria-label="삭제" title="삭제"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8V7M6.5 7l.8 12.1c.1.8.7 1.4 1.5 1.4h6.4c.8 0 1.4-.6 1.5-1.4L17.5 7M10 11v6M14 11v6"/></svg></button></li>`;
    }).join('');
    return `<div class="t-block"><button class="t-label" style="--c:${g.color}" data-new="task" data-d="${tk}" data-project="${g.id}" aria-label="${esc(g.name)}에 할 일 추가">${esc(g.name)}<span class="plus" aria-hidden="true">+</span></button>
      ${rows ? `<ul class="t-list">${rows}</ul>` : ''}</div>`;
  }).join('');

  // 오늘 아무것도 없으면 빈 채로 두지 않고 앞으로 예정된 일정·할 일을 보여줌
  let upBlock = '';
  if (!evRows && !taskBlocks) {
    const ups = [];
    for (let n = 1; n <= 7 && ups.length < 10; n++) { // 예정된 일정은 설정과 상관없이 앞으로 일주일, 최대 10개

        ? `<li class="t-item t-ev up" data-id="${x.id}"><div class="t-row"><span class="bar" style="--c:${p ? p.color : 'var(--ev)'}"></span>${when}<button class="t-title" data-act="edit">${esc(x.title)}</button></div>${del}</li>`

    }).join('');
    if (rows) upBlock = `<div class="t-block t-up-block"><span class="t-label up">예정된 일정</span><ul class="t-list">${rows}</ul></div>`;
  }

  $('#today').innerHTML = `
    <div class="t-date">
      <div class="t-ym"><span>${t.getFullYear()}</span><b>${pad(t.getMonth() + 1)}</b></div>

    </div>
    <div class="t-blocks">${evBlock}${taskBlocks}${upBlock}</div>`;
}

/* ---------- calendar ---------- */
function renderCal() {
  const m0 = state.calMonth, y = m0.getFullYear(), m = m0.getMonth();
  $('#cal-title').innerHTML = `<span class="ym-y">${y}</span><span class="ym-m">${pad(m + 1)}</span>`;
  const first = new Date(y, m, 1), dim = new Date(y, m + 1, 0).getDate();
  const start = addDays(first, -first.getDay());
  const n = Math.ceil((first.getDay() + dim) / 7) * 7;
  const tk = key(TODAY());

/* ---------- 오늘 박스: 할 일 꾹 눌러 끌어서 순서 바꾸기 ---------- */
let rowDrag = null;

  if (!rowDrag) return;

  e.preventDefault();
  const { row } = rowDrag, list = row.parentElement;

  for (const li of sibs) {

/* ---------- 오늘 박스: 왼쪽으로 밀면 삭제 버튼 ---------- */
let swipe = null, openRow = null;
const SWIPE_OPEN = -72;
function closeSwipe() { if (openRow) openRow.classList.remove('swiped'); openRow = null; }
$('#today').addEventListener('pointerdown', e => {
  const li = e.target.closest('.t-item[data-id]');

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cloud.user) pullCloud(false); });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (f) { e.preventDefault(); authForm(f); } });
}
// 로그인 링크에서 돌아왔는데 실패한 경우(만료·이미 쓴 링크): 주소의 오류를 읽어 안내
(() => {
  const raw = (location.hash + '&' + location.search).replace(/\+/g, ' ');
  const m = /error_description=([^&#]+)/.exec(raw); if (!m) return;
  let d = m[1]; try { d = decodeURIComponent(d); } catch (e) {}
  cloud.msg = /expired|invalid/i.test(d) ? '링크가 만료됐거나 이미 쓴 링크예요. 로그인하거나 인증 메일을 다시 받아 주세요.' : '로그인하지 못했어요: ' + d;
  history.replaceState(null, '', location.pathname);
})();

/* ---------- boot ---------- */
const data = load();
state.items = data.items; state.projects = data.projects;
const t0 = TODAY();
state.calMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
applyTheme();
applyMain();
renderAll();
route();
renderAccount();
setInterval(() => { if (!pop.open) renderToday(); }, 60000);
// 설치형(PWA)용 서비스워커: https 또는 localhost에서만 등록
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
