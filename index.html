<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="오늘 할 일과 일정, 한 달 캘린더를 한 화면에서 보는 플래너">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>하루판 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: 한 열. 위에 '오늘' 박스, 아래 월간 캘린더. 날짜를 누르면 할 일/일정 2분할 버튼이 든 팝오버(모바일은 바텀시트). */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EAEEF1; --line:#DCE2E7;
  --fg:#17202A; --muted:#66727E; --accent:#0E7A6A; --accent-soft:#D8EEE9; --on-accent:#FFFFFF;
  --ev:#3D5BD9; --ev-soft:#E2E7FB;
  --p1:#D64535; --p2:#C98010; --p3:#3D6FD6; --p0:#A3ADB7;
  --sun:#D64535; --sat:#3D6FD6; --moon:#A3B6D3; --today-bg:#FFFBE3;
  --shadow:0 1px 2px rgb(16 24 32 / .06), 0 10px 28px rgb(16 24 32 / .07);
  --shadow-pop:0 4px 10px rgb(16 24 32 / .08), 0 22px 48px rgb(16 24 32 / .18);
  --font-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:var(--font-body);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151B; --surface:#191E26; --surface-2:#222833; --line:#2C3340;
  --fg:#E7EAEF; --muted:#939BAA; --accent:#3FC2AB; --accent-soft:#16372F; --on-accent:#0A1A16;
  --ev:#7F97FF; --ev-soft:#212A4A;
  --p1:#F06A5B; --p2:#EFA53A; --p3:#739CFF; --p0:#5E6776;
  --sun:#F06A5B; --sat:#739CFF; --moon:#6F84A6; --today-bg:#2E2B1C;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 10px 28px rgb(0 0 0 / .3);
  --shadow-pop:0 4px 10px rgb(0 0 0 / .4), 0 22px 48px rgb(0 0 0 / .55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#191E26; --surface-2:#222833; --line:#2C3340;
  --fg:#E7EAEF; --muted:#939BAA; --accent:#3FC2AB; --accent-soft:#16372F; --on-accent:#0A1A16;
  --ev:#7F97FF; --ev-soft:#212A4A;
  --p1:#F06A5B; --p2:#EFA53A; --p3:#739CFF; --p0:#5E6776;
  --sun:#F06A5B; --sat:#739CFF; --moon:#6F84A6; --today-bg:#2E2B1C;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 10px 28px rgb(0 0 0 / .3);
  --shadow-pop:0 4px 10px rgb(0 0 0 / .4), 0 22px 48px rgb(0 0 0 / .55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.page{max-width:1120px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- menu rail ---------- */
.rail{display:flex;justify-content:flex-end;gap:4px;margin-bottom:-8px}
.rail-item{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);text-decoration:none}
.rail-item svg{width:20px;height:20px}
.rail-item:hover{background:var(--surface-2);color:var(--fg)}
.rail-item.on{color:var(--accent)}
.rail-item[data-nav="home"].on{background:var(--accent-soft)}
.rail-item[data-nav="my"].on .avatar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;flex:none;line-height:1}
.avatar.sm{width:26px;height:26px;font-size:12px}
.avatar.lg{width:68px;height:68px;font-size:26px}
.avatar.photo{background-color:var(--surface-2);background-size:cover;background-position:center}
.avatar-btn{border:0;padding:0;cursor:pointer}
.avatar-btn:hover{filter:brightness(.93)}
.photo-acts{display:flex;gap:12px;margin-top:6px}
.color-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cc-wheel{width:40px;height:38px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);cursor:pointer}
#cc-hex{height:38px;width:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);text-transform:uppercase}
#cc-hex:focus{outline:none;border-color:var(--accent)}
.ce-row.custom{padding-top:8px;border-top:1px dashed var(--line)}
.card-hrow{display:flex;align-items:center;gap:12px}
.card-hrow .card-h{margin-right:auto}
.btn.sm{height:28px;padding:0 12px;font-size:12px}
#main-colors.editing .ce-c{position:relative;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ce-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface);cursor:pointer}
.ce-c.dragging{opacity:.3;transform:scale(.85)}
.pal-ghost{position:fixed;z-index:70;width:34px;height:34px;border-radius:50%;background:var(--sw);pointer-events:none;transform:translate(-50%,-50%) scale(1.15);box-shadow:var(--shadow-pop),inset 0 0 0 1px rgb(0 0 0 / .1)}
body.pal-dragging,body.pal-dragging *{cursor:grabbing!important}
.switch-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding-top:4px;position:relative}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.sw-track{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch-row input:checked + .sw-track{background:var(--accent)}
.switch-row input:checked + .sw-track::after{transform:translateX(16px)}
.switch-row input:focus-visible + .sw-track{outline:2px solid var(--accent);outline-offset:2px}
.switch-row b{display:block;font-size:13.5px}
.switch-row small{display:block;font-size:12px;color:var(--muted)}

/* ---------- my page ---------- */
.my{max-width:640px;width:100%}
.my-title{margin:0;font-size:24px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.card-h{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.prof{display:flex;align-items:center;gap:16px;min-width:0}
.prof-text{display:flex;flex-direction:column;min-width:0}
.prof-text b{font-size:18px;overflow-wrap:anywhere}
.prof-text span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.swatches{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.swatch{display:grid;place-items:center;padding:7px;border-radius:50%}
.swatch:hover{background:var(--surface-2)}
.swatch .sw{width:30px;height:30px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.swatch.on .sw{box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08),0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.sw-div{width:1px;height:24px;background:var(--line);margin:0 6px}
.mseg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.mseg button{padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.mseg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.note{font-size:12px;color:var(--muted);margin:0}

/* ---------- split button ---------- */
.split{display:inline-flex;align-items:stretch;border-radius:11px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.split button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;font-weight:600;font-size:13.5px;flex:1;white-space:nowrap}
.split button svg{width:17px;height:17px;flex:none}
.split button[data-new="task"]{color:var(--accent)}
.split button[data-new="event"]{color:var(--ev)}
.split button[data-new="task"]:hover{background:var(--accent-soft)}
.split button[data-new="event"]:hover{background:var(--ev-soft)}
.split .div{width:1px;background:var(--line)}
.split.wide{display:flex;width:100%}
.split.wide button{padding:13px 10px;flex-direction:column;gap:4px;font-size:13.5px}
.split.wide button svg{width:22px;height:22px}

/* ---------- today box (위젯형, 미니멀) ---------- */
#today{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:32px}
.t-date{display:flex;flex-direction:column}
.t-ym{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.t-ym b{font-size:16px;font-weight:800;color:var(--fg)}
.t-day{font-family:var(--font-num);font-size:68px;font-weight:800;line-height:1;letter-spacing:-.04em;margin-top:4px;color:var(--accent)}
.t-dow{font-size:15px;font-weight:600;margin-top:6px}
.t-bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:6px}
.t-bar span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.t-add{margin-top:auto;padding-top:20px}
.msplit{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.msplit button{padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.msplit button:hover{color:var(--fg);background:var(--surface-2)}
.msplit .div{width:1px;background:var(--line)}
.t-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 32px;align-content:start;min-width:0}
.t-block{min-width:0}
.t-label{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 28%,transparent);color:color-mix(in srgb,var(--c) 50%,var(--fg))}
.t-label .plus{font-weight:500;opacity:.55;font-size:13px;line-height:1}
.t-label:hover .plus{opacity:1}
.t-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.t-item{display:flex;align-items:center;gap:10px;padding:5px 0;min-width:0}
.box{width:18px;height:18px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--line));flex:none;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.box svg{width:11px;height:11px}
.box:hover{border-color:var(--c)}
.t-item.done .box{background:var(--c);border-color:color-mix(in srgb,var(--c) 80%,var(--fg));color:var(--oc,#fff)}
.t-title{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.t-item.done .t-title{color:var(--muted)}
.t-meta{font-family:var(--font-num);font-size:11.5px;color:var(--muted);flex:none}
.t-meta.late{color:var(--p1);font-family:var(--font-body);font-weight:600}
.t-flag{width:5px;height:5px;border-radius:50%;background:var(--p1);flex:none}
.t-ev .tm{width:40px;flex:none;font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.t-ev .bar{width:3px;height:15px;border-radius:2px;background:color-mix(in srgb,var(--c) 85%,var(--fg));flex:none}
.t-ev.past{opacity:.4}
.t-ev.now .tm{color:var(--ev);font-weight:700}
.t-empty{font-size:12.5px;color:var(--muted);padding:5px 0;margin:0}

/* ---------- rows ---------- */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:11px;padding:8px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--pc,var(--p0));flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.check svg{width:12px;height:12px}
.check:hover{color:var(--pc,var(--p0))}
.check.p1{--pc:var(--p1)} .check.p2{--pc:var(--p2)} .check.p3{--pc:var(--p3)}
.row.done .check{background:var(--p0);border-color:var(--p0);color:var(--surface)}
.evtime{flex:none;width:58px;font-family:var(--font-num);font-size:12.5px;font-weight:600;color:var(--ev);padding-top:1px;border-right:2px solid var(--c,var(--ev));margin-right:1px}
.row.past{opacity:.5}
.row-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.meta .late{color:var(--p1);font-weight:600}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);margin-right:4px;vertical-align:1px}
.empty{color:var(--muted);font-size:13px;padding:8px 2px;margin:0}

/* ---------- calendar ---------- */
.cal-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px}
.cal-mid{display:flex;align-items:center;gap:12px}
.cal-h h2{margin:0;display:flex;align-items:baseline;justify-content:center;gap:.4em;font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:4.2em;line-height:1.1}
.ym-y{font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:.02em}
.cal-right{justify-self:end}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.arrow:hover{background:var(--surface-2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.icon{width:32px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--p1)}
.btn.danger.armed{background:var(--p1);border-color:var(--p1);color:#fff}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow div{padding:8px 10px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-dow div:first-child{color:var(--sun)} .cal-dow div:last-child{color:var(--sat)}
.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cal-grid .cell:nth-last-child(-n+7){border-bottom:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.cell.out .dnum{opacity:.45}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dtop{display:flex;flex-direction:column;align-items:center;min-width:0;margin-bottom:2px}
.dnum{font-family:var(--font-num);font-weight:600;font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.sun .dnum,.cell.hd .dnum{color:var(--sun)} .cell.sat .dnum{color:var(--sat)}
.cell.today,.cell.today:hover{background:var(--today-bg)}
.cell.today .dnum{color:var(--accent);font-weight:800}
.cell.today .dnum.pulse{animation:todayPulse 1.2s ease-out}
@keyframes todayPulse{
  0%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
  45%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 12px transparent}
  100%{background:transparent;box-shadow:0 0 0 0 transparent}
}
.pop.tinted .pill{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 45%,var(--fg))}
.pop.tinted .allday.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pop.tinted .field input:focus,.pop.tinted .field select:focus{border-color:color-mix(in srgb,var(--accent) 70%,var(--fg))}
.hol{font-size:10px;line-height:1.2;max-width:100%;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lunar{display:flex;align-items:center;gap:2px;margin-top:1px;font-size:9.5px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lunar .lt{opacity:.7}
.moon{width:12px;height:12px;flex:none;color:var(--moon)}
.t-day.hd{color:var(--sun)}
.cchips{display:flex;flex-direction:column;gap:2px;min-width:0}
.cchip{display:block;font-size:11.5px;line-height:1.4;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.ev{color:var(--fg)}
.cchip.sq{display:flex;align-items:center;gap:6px;padding:1px 4px}
.cchip .ct{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cchip.ev b{font-family:var(--font-num);font-weight:600;color:var(--ev);margin-right:3px}
.cchip.tk::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--accent);border-radius:50%;margin-right:5px;vertical-align:-1px}
.cchip.tk.done{color:var(--muted);text-decoration:line-through}
.cchip.tk.done::before{background:var(--p0);border-color:var(--p0)}
.tsq{display:inline-grid;grid-template-rows:1fr 1fr;place-items:center;width:21px;height:21px;border:1px solid currentColor;border-radius:5px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:9px;font-weight:700;line-height:1;letter-spacing:0;color:var(--ev);flex:none;padding:1px 0}
.t-ev .tsq{width:26px;height:26px;font-size:10.5px}
.t-ev .tm b{font:inherit;color:inherit}
.tseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:32px;background:var(--surface)}
.tseg button{padding:0 10px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.tseg button + button{border-left:1px solid var(--line)}
.tseg button.on{color:var(--fg);background:var(--surface-2)}
.tseg .tsq{width:18px;height:18px;font-size:7.5px;color:currentColor}
.cmore{font-size:11px;color:var(--muted);padding-left:5px}
.sqgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:calc(21px * 3 + 4px * 2);margin:2px auto 0}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots i.ev{background:var(--ev)}

.foot{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}

<script>
(() => {
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const diffDays = k => Math.round((fromKey(k) - TODAY()) / 864e5);
const PCOLORS = ['#4F5FD9', '#D9822B', '#A24FCF', '#1F9D74', '#D94F7A', '#2C8FB8'];
const DEFAULT_MAIN = '#0E7A6A';
// 전체 색 목록 = 기본 팔레트 + 내가 추가한 색(마지막 줄)
// 색 목록: 사용자가 순서를 바꾸거나 지우면 prefs.palette에 저장, 아니면 기본 팔레트 + 내가 추가한 색
const palette = () => prefs.palette || [...CAT_COLORS.flat(), ...(prefs.customColors || [])];
const setPalette = list => { prefs.palette = list; delete prefs.customColors; savePrefs(); };
const allColors = () => [palette()];
// 카테고리 색 목록: 기본 · Pinterest Palette 2026 · coolors 팔레트 두 개
const CAT_COLORS = [
  ['#4F5FD9', '#2C8FB8', '#1F9D74', '#0E7A6A', '#D9822B', '#D94F7A', '#A24FCF', '#59616C'],
  ['#D7EFFF', '#AEB8A0', '#351E28', '#E9F056', '#FF5C34'],
  ['#F0D7DF', '#F9E0E2', '#F8EAEC', '#F7DDD9', '#F7E6DA', '#E3E9DD', '#C4DBD9', '#D4E5E3', '#CAE0E4', '#C8C7D6'],
  ['#EDDCD2', '#FFF1E6', '#FDE2E4', '#FAD2E1', '#C5DEDD', '#DBE7E4', '#F0EFEB', '#D6E2E9', '#BCD4E6', '#99C1DE'],
];
const REP_LABEL = { weekly: '매주', monthly: '매달', yearly: '매년' };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(m)}`; }
function endTime(t, dur) { const e = Math.min(toMin(t) + (dur || 60), 1439); return `${pad(Math.floor(e / 60))}:${pad(e % 60)}`; }
function dateLabel(k) {
  const n = diffDays(k), d = fromKey(k);
  if (n === 0) return '오늘'; if (n === 1) return '내일'; if (n === 2) return '모레'; if (n === -1) return '어제';
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
const longDate = k => { const d = fromKey(k); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };

const IC = {
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.6 2.5 4.9-5.2"/></svg>',
  event: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M12 12.5v3l2 1.2"/></svg>',
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.4 2.3 4.6-5"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 6l-6 6 6 6"/></svg>',
};
const splitHTML = (k, wide) => `<div class="split ${wide ? 'wide' : ''}"><button data-new="task" data-d="${k}">${IC.task}할 일 추가</button><span class="div"></span><button data-new="event" data-d="${k}">${IC.event}일정 추가</button></div>`;

/* ---------- 음력 · 공휴일 ---------- */
const LUNAR_FMT = (() => {
  for (const ca of ['dangi', 'chinese']) {
    try {
      const f = new Intl.DateTimeFormat('en-u-ca-' + ca, { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' });
      if (f.resolvedOptions().calendar === ca) return f;
    } catch (e) {}
  }
  return null;
})();
const lunarCache = new Map();
function lunar(k) {
  if (!LUNAR_FMT) return null;
  if (lunarCache.has(k)) return lunarCache.get(k);
  const d = fromKey(k); d.setHours(12);
  const parts = LUNAR_FMT.formatToParts(d);
  const ms = (parts.find(p => p.type === 'month') || {}).value || '';
  const ds = (parts.find(p => p.type === 'day') || {}).value || '';
  const r = { m: parseInt(ms, 10), d: parseInt(ds, 10), leap: !/^\d+$/.test(ms) };
  lunarCache.set(k, r);
  return r;
}
const EXTRA_HOLIDAYS = { '2026-06-03': '지방선거' };
const holCache = new Map();
function holidaysOf(y) {
  if (holCache.has(y)) return holCache.get(y);
  const H = new Map(), groups = [];
  const add = (k, n) => { if (!H.has(k)) H.set(k, []); H.get(k).push(n); };
  // rule: null = 대체 없음, wk = 토·일과 겹치면, wk+ = 토·일 또는 다른 공휴일과 겹치면, sun+ = 일요일 또는 다른 공휴일과 겹치면
  [['01-01', '신정', null], ['03-01', '삼일절', 'wk'], ['05-05', '어린이날', 'wk+'], ['06-06', '현충일', null],
   ['08-15', '광복절', 'wk'], ['10-03', '개천절', 'wk'], ['10-09', '한글날', 'wk'], ['12-25', '성탄절', 'wk']]
    .forEach(([md, n, rule]) => { const k = `${y}-${md}`; add(k, n); groups.push({ days: [k], rule }); });
  Object.entries(EXTRA_HOLIDAYS).forEach(([k, n]) => { if (+k.slice(0, 4) === y) add(k, n); });

    [new RegExp('\\s(?:이번\\s*주\\s*)?([월화수목금토일])요일' + P + '(?=\\s)'), m => out.date = key(addDays(t, (wd(m[1]) - t.getDay() + 7) % 7))],
  ];

      const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
      cv.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      prefs.photo = cv.toDataURL('image/jpeg', 0.85); savePrefs(); renderProfile(); toast('프로필 사진을 바꿨어요');
    };
    img.onerror = () => toast('이 이미지는 열 수 없어요');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
$('#photo-file').addEventListener('change', e => { setPhoto(e.target.files[0]); e.target.value = ''; });
$('#cc-wheel').addEventListener('input', e => { $('#cc-hex').value = e.target.value.toUpperCase(); $('#cc-err').hidden = true; });
$('#cc-hex').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addColor(); } });
function renderProfile() {
  ['#rail-avatar', '#my-avatar'].forEach(sel => {
    const a = $(sel);
    a.textContent = prefs.photo ? '' : initial();
    a.style.backgroundImage = prefs.photo ? `url("${prefs.photo}")` : '';
    a.classList.toggle('photo', !!prefs.photo);
  });
  $('#photo-clear').hidden = !prefs.photo;
  $('#my-name-view').textContent = (prefs.name || '').trim() || '이름을 정해 주세요';
  $('#my-bio-view').textContent = (prefs.bio || '').trim() || '한 줄 소개가 아직 없어요';
  document.querySelectorAll('[data-mode]').forEach(b => { const on = b.dataset.mode === (prefs.mode || 'system'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function route() {
  const v = location.hash === '#my' ? 'my' : 'home';
  $('#v-home').hidden = v !== 'home';
  $('#v-my').hidden = v !== 'my';
  document.querySelectorAll('[data-nav]').forEach(a => { const on = a.dataset.nav === v; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (pop.open) closePop();
  if (v === 'my') { $('#my-name').value = prefs.name || ''; $('#my-bio').value = prefs.bio || ''; catEdit = null; renderCats(); renderMain(); }
  renderProfile();
  window.scrollTo(0, 0);
}
['name', 'bio'].forEach(f => $('#my-' + f).addEventListener('input', e => { prefs[f] = e.target.value; savePrefs(); renderProfile(); }));
window.addEventListener('hashchange', route);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  if (e.target.closest('#clip-cancel')) { clip = null; renderAll(); return; }
  const cl = e.target.closest('[data-clip]');
  if (cl) { const id = cl.closest('[data-id]').dataset.id; clip = { id, mode: cl.dataset.clip }; pop.open = false; renderAll(); return; }
  const rp = e.target.closest('[data-rep]');
  if (rp) { rp.parentElement.querySelectorAll('[data-rep]').forEach(b => { const on = b === rp; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); return; }
  const cvb = e.target.closest('[data-cv]');
  if (cvb) { state.calView = cvb.dataset.cv; try { localStorage.setItem('harupan.cv', state.calView); } catch (err) {} clip = null; renderAll(); return; }
  const tc = e.target.closest('[data-tid]');
  if (tc) {
    if (clip && clip.id !== tc.dataset.tid) pasteTo(tc.closest('[data-day]').dataset.day);
    else { clip = clip ? null : { id: tc.dataset.tid, mode: 'copy' }; renderAll(); }
    return;
  }
  if (clip) { const dc = e.target.closest('[data-day]'); if (dc) { pasteTo(dc.dataset.day); return; } }
  const adt = e.target.closest('[data-allday-toggle]');
  if (adt) {
    const f = $('#form'), on = f.dataset.allday !== '1';
    f.dataset.allday = on ? '1' : '0'; adt.classList.toggle('on', on); adt.setAttribute('aria-pressed', on);
    placePop(); return;
  }
  const pdel = e.target.closest('[data-del]');
  if (pdel) { setPalette(palette().filter(x => x !== pdel.dataset.del)); renderMain(); if (catEdit) renderCats(); toast('색을 지웠어요'); return; }
  if (e.target.closest('#pal-edit')) { palEdit = !palEdit; renderMain(); return; }
  if (e.target.closest('#pal-reset')) { delete prefs.palette; delete prefs.customColors; savePrefs(); renderMain(); if (catEdit) renderCats(); toast('기본 색 목록으로 되돌렸어요'); return; }
  const mc = e.target.closest('[data-main]');
  if (mc) { setMain(mc.dataset.main); return; }
  if (e.target.closest('#cc-add')) { addColor(); return; }
  if (e.target.closest('#photo-pick') || e.target.closest('#my-avatar')) { $('#photo-file').click(); return; }
  if (e.target.closest('#photo-clear')) { delete prefs.photo; savePrefs(); renderProfile(); toast('프로필 사진을 지웠어요'); return; }
  const cc = e.target.closest('[data-cc]');
  if (cc) { const p = proj(catEdit); if (p) { p.color = cc.dataset.cc; save(); renderCats(); renderAll(); } return; }
  const cb = e.target.closest('[data-cat]');
  if (cb) { catEdit = catEdit === cb.dataset.cat ? null : cb.dataset.cat; renderCats(); if (catEdit) $('#ce-name').focus(); return; }
  const ca = e.target.closest('[data-cat-add]');
  if (ca) {
    const kind = ca.dataset.catAdd, base = CAT_COLORS[0];
    const np = { id: 'p' + Date.now().toString(36), kind, name: '새 카테고리', color: base[cats(kind).length % base.length] };
    state.projects.push(np); save(); catEdit = np.id; renderCats(); renderAll();
    const nm = $('#ce-name'); nm.focus(); nm.select(); return;
  }
  if (e.target.closest('#ce-done')) {
    const p = proj(catEdit); if (p && !p.name.trim()) { p.name = '이름 없음'; save(); renderAll(); }
    catEdit = null; renderCats(); return;
  }
  const cdel = e.target.closest('#ce-del');
  if (cdel) {
    if (!cdel.dataset.armed) { cdel.dataset.armed = '1'; cdel.classList.add('armed'); cdel.textContent = '한 번 더 누르면 삭제'; return; }
    const id = catEdit;
    state.projects = state.projects.filter(p => p.id !== id);
    state.items.forEach(i => { if (i.project === id) i.project = null; });
    save(); catEdit = null; renderCats(); renderAll(); toast('카테고리를 삭제했어요'); return;
  }
  const md = e.target.closest('[data-mode]');
  if (md) { prefs.mode = md.dataset.mode; savePrefs(); applyTheme(); renderProfile(); return; }
  const nw = e.target.closest('[data-new]');
  if (nw) { openForm(nw.dataset.new, nw.dataset.d, nw, null, nw.dataset.project); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = act.closest('[data-id]')?.dataset.id, it = state.items.find(x => x.id === id);
    if (!it) return;
    if (act.dataset.act === 'toggle') { it.done = !it.done; save(); renderAll(); if (it.done) toast(`완료: ${it.title}`); }
    else openForm(it.type, it.date || key(TODAY()), act, it.id);
    return;
  }
  const pa = e.target.closest('[data-pop]');
  if (pa) {
    const a = pa.dataset.pop;
    if (a === 'close') closePop();
    else if (a === 'back') popBack();
    else if (a === 'save') saveForm();
    else if (a === 'del') {
      if (!pa.dataset.armed) { pa.dataset.armed = '1'; pa.classList.add('armed'); pa.textContent = '한 번 더 누르면 삭제'; return; }
      const it = state.items.find(x => x.id === pop.editId);
      state.items = state.items.filter(x => x.id !== pop.editId); save();
      if (it) toast(`삭제했어요: ${it.title}`);
      popBack();
    }
    return;
  }
  const day = e.target.closest('[data-day]');
  if (day) { openDay(day.dataset.day, day); return; }
  const ts = e.target.closest('[data-ts]');
  if (ts) { state.timeStyle = ts.dataset.ts; try { localStorage.setItem('harupan.ts', state.timeStyle); } catch (err) {} renderAll(); return; }
  const cal = e.target.closest('[data-cal]');
  if (cal) {
    const n = +cal.dataset.cal, t = TODAY(), prev = state.calMonth;
    state.calMonth = n === 0 ? new Date(t.getFullYear(), t.getMonth(), 1) : new Date(prev.getFullYear(), prev.getMonth() + n, 1);
    pop.open = false; renderAll();
    if (n === 0) goTodayFx(Math.sign(state.calMonth - prev));
  }
});
$('#popback').addEventListener('click', closePop);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && clip && !pop.open) { clip = null; renderAll(); return; }
  if (!pop.open) return;
  if (e.key === 'Escape') { pop.mode === 'form' ? popBack() : closePop(); }
  if (e.key === 'Enter' && pop.mode === 'form' && e.target.id === 'f-title') { e.preventDefault(); saveForm(); }
});
window.addEventListener('resize', () => { if (pop.open) placePop(); });
const resetBtn = $('#reset');
resetBtn.addEventListener('click', () => {
  if (!resetBtn.dataset.armed) { resetBtn.dataset.armed = '1'; resetBtn.classList.add('warn'); resetBtn.textContent = '한 번 더 누르면 모든 변경이 지워져요'; return; }
  const s = seed(); state.items = s.items; state.projects = s.projects; save();
  resetBtn.dataset.armed = ''; resetBtn.classList.remove('warn'); resetBtn.textContent = '예시 데이터로 되돌리기';
  pop.open = false; renderAll(); toast('예시 데이터로 되돌렸어요');
});

/* ---------- boot ---------- */
const data = load();
state.items = data.items; state.projects = data.projects;
const t0 = TODAY();
state.calMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
applyTheme();
applyMain();
renderAll();
route();
setInterval(() => { if (!pop.open) renderToday(); }, 60000);
})();
</script>
</body>
</html>
